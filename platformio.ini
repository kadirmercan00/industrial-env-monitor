; PlatformIO Project Configuration File for Industrial Environmental Monitor
; Kadir Mercan (Mercan Studio)

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino

monitor_speed = 115200

build_flags = 
    -I include

lib_deps =
    adafruit/Adafruit CCS811 Library @ ^1.1.3
    arduino-libraries/NTPClient @ ^3.2.1
